<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg); }
  .row { display: flex; align-items: baseline; gap: 20px; padding: 10px 0; border-bottom: 1px solid var(--border-muted); }
  .row:last-child { border-bottom: none; }
  .size { width: 72px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-faint); flex-shrink: 0; letter-spacing: 0; }
  /* line-height must clear descenders — 1.15 gives y/g/p room */
  .sample { color: var(--fg); flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-bottom: 2px; }
</style>
</head>
<body>
  <div class="row"><span class="size">64 / 600</span><span class="sample" style="font-size:64px;font-weight:600;letter-spacing:-0.03em;line-height:1.15">Running in&nbsp;<span style="color:var(--accent)">terminal</span></span></div>
  <div class="row"><span class="size">46 / 600</span><span class="sample" style="font-size:46px;font-weight:600;letter-spacing:-0.03em;line-height:1.15">Display headline</span></div>
  <div class="row"><span class="size">34 / 600</span><span class="sample" style="font-size:34px;font-weight:600;letter-spacing:-0.02em;line-height:1.2">Section heading</span></div>
  <div class="row"><span class="size">20 / 600</span><span class="sample" style="font-size:20px;font-weight:600;letter-spacing:-0.01em;line-height:1.3">Subsection heading</span></div>
</body>
</html>
