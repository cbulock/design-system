<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cindor · terminal</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { height: 100%; background: var(--bg); }
  .app { display: flex; height: 100vh; overflow: hidden; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .content { flex: 1; overflow: auto; background: var(--bg-subtle); }
  .hov:hover { background: var(--bg-muted); }
  button:focus-visible, input:focus-visible { outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn-secondary:hover { border-color: var(--border-strong) !important; background: var(--bg-subtle) !important; }
  .btn-primary:hover { background: var(--accent-hover) !important; border-color: var(--accent-hover) !important; }
  .btn-outline:hover { background: var(--accent-muted) !important; }
  .btn-ghost:hover { background: var(--bg-muted) !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="./Icon.jsx"></script>
<script type="text/babel" src="./Primitives.jsx"></script>
<script type="text/babel" src="./Sidebar.jsx"></script>
<script type="text/babel" src="./TopBar.jsx"></script>
<script type="text/babel" src="./Views.jsx"></script>

<script type="text/babel">
function App() {
  const [active, setActive] = React.useState(() => localStorage.getItem('cindor.nav') || 'home');
  const [theme, setTheme] = React.useState(() => localStorage.getItem('cindor.theme') || 'light');
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('cindor.theme', theme);
  }, [theme]);
  React.useEffect(() => { localStorage.setItem('cindor.nav', active); }, [active]);
  const crumbs = { home: ['home'], inbox: ['inbox'], projects: ['projects'], files: ['files'], atlas: ['projects', 'atlas'], cindor: ['projects', 'cindor'], drafts: ['files', 'field-journal'] }[active] || ['home'];
  const View = { home: HomeView, inbox: InboxView, projects: ProjectsView, files: ProjectsView, atlas: ProjectsView, cindor: ProjectsView, drafts: InboxView }[active] || HomeView;
  return (
    <div className="app">
      <Sidebar active={active} onNav={setActive} />
      <div className="main">
        <TopBar crumbs={crumbs} theme={theme} onToggleTheme={() => setTheme(t => t === 'light' ? 'dark' : 'light')} />
        <div className="content"><View /></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
