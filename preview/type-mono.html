<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .block {
    font-family: var(--font-mono); font-size: 12px; line-height: 1.7;
    background: #0f0e0c; color: #f3f1ec; padding: 16px 20px;
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    letter-spacing: -0.01em;
  }
  .comment { color: #878273; }
  .amber { color: #e07d2c; }
  .green { color: #7ac74f; }
  .str { color: #f4c496; }
</style>
</head>
<body>
  <div class="block">
<span class="comment">// JetBrains Mono · 12px</span><br>
<span class="amber">const</span> cindor = {<br>
&nbsp;&nbsp;name: <span class="str">'Cindor'</span>, version: <span class="str">'0.3.0'</span>,<br>
&nbsp;&nbsp;status: <span class="green">'live'</span>, updated: <span class="str">'2026-04-23'</span>,<br>
};<br>
<span class="comment">// → ok · compiled in 142ms</span>
  </div>
</body>
</html>
