<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    padding: 2px 8px; height: 20px; border-radius: 3px;
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--border); background: var(--bg-subtle); color: var(--fg-muted);
    letter-spacing: 0.02em; text-transform: uppercase;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .success { background: color-mix(in srgb, #7ac74f 14%, transparent); color: #3d6a29; border-color: color-mix(in srgb, #7ac74f 32%, transparent); }
  .warning { background: color-mix(in srgb, #b45309 12%, transparent); color: #b45309; border-color: color-mix(in srgb, #b45309 30%, transparent); }
  .danger  { background: color-mix(in srgb, #b91c1c 12%, transparent); color: #b91c1c; border-color: color-mix(in srgb, #b91c1c 30%, transparent); }
  .accent  { background: color-mix(in srgb, #c2410c 12%, transparent); color: #c2410c; border-color: color-mix(in srgb, #c2410c 30%, transparent); }
  .solid   { background: var(--fg); color: var(--bg); border-color: var(--fg); }
</style>
</head>
<body>
  <span class="badge"><span class="dot"></span>DEFAULT</span>
  <span class="badge success"><span class="dot"></span>LIVE</span>
  <span class="badge warning"><span class="dot"></span>PENDING</span>
  <span class="badge danger"><span class="dot"></span>FAILED</span>
  <span class="badge accent"><span class="dot"></span>ACTIVE</span>
  <span class="badge solid">BETA</span>
  <span class="badge">v0.3.0</span>
  <span class="badge">142ms</span>
</body>
</html>
