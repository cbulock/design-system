<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .row { display: flex; align-items: center; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border-muted); }
  .row:last-child { border-bottom: none; }
  .token { width: 80px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); }
  .bar { height: 10px; background: var(--accent); border-radius: 2px; }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); width: 52px; text-align: right; }
</style>
</head>
<body>
  <div class="row"><span class="token">space-1</span><div class="bar" style="width:4px"></div><span class="val">4</span></div>
  <div class="row"><span class="token">space-2</span><div class="bar" style="width:8px"></div><span class="val">8</span></div>
  <div class="row"><span class="token">space-3</span><div class="bar" style="width:12px"></div><span class="val">12</span></div>
  <div class="row"><span class="token">space-4</span><div class="bar" style="width:16px"></div><span class="val">16</span></div>
  <div class="row"><span class="token">space-6</span><div class="bar" style="width:24px"></div><span class="val">24</span></div>
  <div class="row"><span class="token">space-8</span><div class="bar" style="width:32px"></div><span class="val">32</span></div>
  <div class="row"><span class="token">space-12</span><div class="bar" style="width:48px"></div><span class="val">48</span></div>
  <div class="row"><span class="token">space-16</span><div class="bar" style="width:64px"></div><span class="val">64</span></div>
</body>
</html>
