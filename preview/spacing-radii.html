<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); display: flex; gap: 16px; align-items: flex-end; }
  .r { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
  .box { width: 72px; height: 72px; background: var(--surface); border: 1px solid var(--border); }
  .box.accent { background: var(--accent); border-color: var(--accent); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg); }
</style>
</head>
<body>
  <div class="r"><div class="box" style="border-radius:4px"></div><span class="name">xs</span><span class="label">4px</span></div>
  <div class="r"><div class="box" style="border-radius:6px"></div><span class="name">sm</span><span class="label">6px</span></div>
  <div class="r"><div class="box" style="border-radius:8px"></div><span class="name">md</span><span class="label">8px</span></div>
  <div class="r"><div class="box accent" style="border-radius:12px"></div><span class="name">lg · default</span><span class="label">12px</span></div>
  <div class="r"><div class="box" style="border-radius:16px"></div><span class="name">xl</span><span class="label">16px</span></div>
  <div class="r"><div class="box" style="border-radius:20px"></div><span class="name">2xl</span><span class="label">20px</span></div>
  <div class="r"><div class="box" style="border-radius:9999px"></div><span class="name">full</span><span class="label">pill</span></div>
</body>
</html>
