<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); display: flex; gap: 12px; flex-wrap: wrap; }
  .w { display: flex; flex-direction: column; gap: 6px; }
  .sample { font-size: 40px; color: var(--fg); line-height: 1; letter-spacing: -0.02em; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
</style>
</head>
<body>
  <div class="w"><div class="sample" style="font-weight:200">Aa</div><div class="label">200 · thin</div></div>
  <div class="w"><div class="sample" style="font-weight:300">Aa</div><div class="label">300 · light</div></div>
  <div class="w"><div class="sample" style="font-weight:400">Aa</div><div class="label">400 · regular</div></div>
  <div class="w"><div class="sample" style="font-weight:500">Aa</div><div class="label">500 · medium</div></div>
  <div class="w"><div class="sample" style="font-weight:600">Aa</div><div class="label">600 · semibold</div></div>
  <div class="w"><div class="sample" style="font-weight:700">Aa</div><div class="label">700 · bold</div></div>
  <div class="w"><div class="sample" style="font-weight:800">Aa</div><div class="label">800 · black</div></div>
</body>
</html>
