<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .pane { padding: 24px; min-height: 260px; }
  .pane.light { background: #faf9f6; color: #0f0e0c; }
  .pane.dark { background: #0f0e0c; color: #f3f1ec; }
  .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; margin-bottom: 14px; }
  .h { font-family: var(--font-sans); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 6px; }
  .p { font-size: 13px; opacity: 0.7; line-height: 1.5; margin-bottom: 14px; }
  .btn { font-family: var(--font-sans); font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 4px; border: 1px solid currentColor; display: inline-block; background: transparent; color: inherit; }
  .btn.primary { background: #c2410c; border-color: #c2410c; color: #fff; }
  .dark .btn.primary { background: #e07d2c; border-color: #e07d2c; color: #0f0e0c; }
</style>
</head>
<body>
  <div class="pane light">
    <div class="label">Light · cream</div>
    <div class="h">Hello, operator.</div>
    <div class="p">Warm cream #faf9f6 with amber-undertone grays and a single burnt-orange accent.</div>
    <a class="btn primary">Run build</a>&nbsp;<a class="btn">Docs</a>
  </div>
  <div class="pane dark">
    <div class="label">Dark · terminal</div>
    <div class="h">Hello, operator.</div>
    <div class="p">Near-black #0f0e0c, phosphor-adjacent amber, hairline borders at 8% opacity.</div>
    <a class="btn primary">Run build</a>&nbsp;<a class="btn">Docs</a>
  </div>
</body>
</html>
